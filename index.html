<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPO JSS - Live IPO Updates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f29;
            --bg-card: #1e2530;
            --border-color: #2a3140;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --text-muted: #6c757d;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #0f1419;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.6s ease-in-out 2.5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .splash-logo {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: logoFadeIn 0.8s ease-out;
            padding: 10px;
        }

        @keyframes logoFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .splash-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .splash-text {
            color: white;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
            animation: textFadeIn 0.8s ease-out 0.3s backwards;
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-subtitle {
            display: none;
        }

        .splash-tagline {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: textFadeIn 0.8s ease-out 0.7s backwards;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
        }

        .icon-btn:hover {
            background: var(--border-color);
        }

        .notification-badge {
            position: relative;
        }

        .notification-badge::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
        }

        /* Search Modal */
        .search-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1001;
            padding: 20px;
        }

        .search-modal.active {
            display: flex;
            flex-direction: column;
        }

        .search-header {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 65px;
            z-index: 99;
        }

        .tab {
            flex: 1;
            padding: 14px 16px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: var(--text-secondary);
        }

        .tab.active[data-status="open"] {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        .tab.active[data-status="upcoming"] {
            color: var(--accent-orange);
            border-bottom-color: var(--accent-orange);
        }

        .tab.active[data-status="closed"] {
            color: var(--accent-red);
            border-bottom-color: var(--accent-red);
        }

        /* Filter Section */
        .filter-section {
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 113px;
            z-index: 98;
        }

        .filter-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .board-filters {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .board-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .board-filter input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        .board-filter label {
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Sort button removed as requested */

        .active-filter-badge {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-primary);
        }

        /* Main Content */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 8px;
        }

        /* IPO Cards */
        .ipo-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 40px;
            transition: all 0.2s;
            overflow: hidden;
            position: relative;
        }

        .ipo-card:hover {
            border-color: #3b82f6;
        }

        .card-header {
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .company-name-full {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
        }

        .card-main-content {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            align-items: flex-start;
        }

        .company-logo {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #333;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .company-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .info-grid-simple {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 4px;
        }

        .info-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .info-label-side {
            color: var(--text-secondary);
        }

        .info-value-side {
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-divider {
            height: 1px;
            background: var(--border-color);
            margin: 12px 0;
        }

        .gmp-row {
            padding: 8px 0;
        }

        .dates-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 54px 1.4fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            height: 46px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-view {
            background: #ffffff;
            color: #000000;
            border: 1px solid #e2e8f0;
        }

        .btn-share-icon {
            background: #0ea5e9;
            color: #ffffff;
            padding: 0;
            width: 54px;
        }

        .btn-allotment {
            background: #0ea5e9;
            color: #ffffff;
            text-decoration: none;
        }

        .btn-disabled {
            background: #2a3140 !important;
            color: #6c757d !important;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .disclaimer-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
            text-align: left;
        }

        .board-badge {
            margin: 16px -22px -22px -22px;
            padding: 12px;
            border-radius: 0 0 12px 12px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
        }

        .board-badge.mainboard {
            background: #8b5cf6;
        }

        .board-badge.sme {
            background: #f97316;
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 12px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
            border-radius: 12px 12px 0 0;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-close:hover {
            background: var(--bg-card);
        }

        .modal-body {
            padding: 16px 8px;
        }

        .detail-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
        }

        .detail-table th,
        .detail-table td {
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-table th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .detail-table tr:last-child td {
            border-bottom: none;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 13px;
            text-align: right;
        }

        .highlights-list {
            list-style: none;
        }

        .highlights-list li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
            font-size: 13px;
            line-height: 1.5;
        }

        .highlights-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .card-info {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .filter-section {
                top: 65px;
            }

            .tabs {
                top: 65px;
            }
        }
    </style>
</head>

        ];

        let IPO_LIST = DEFAULT_IPO_LIST;
        let currentFilter = 'open';

        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
        }

        function getLogoColor(index) {
            const colors = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                'linear-gradient(135deg, #30cfd0 0%, #330867 100%)'
            ];
            return colors[index % colors.length];
        }

        function shareIPO(ipo, event) {
            event.stopPropagation();

            const shareText = `📊 ${ipo.name} IPO Details\n\n` +
                `💰 Price Band: ${ipo.priceBand}\n` +
                `📅 Dates: ${ipo.openDate} - ${ipo.closeDate}\n` +
                `📈 GMP: ${ipo.gmp}\n` +
                `💵 Issue Size: ${ipo.issueSize}\n` +
                `📦 Lot Size: ${ipo.lotSize}\n\n` +
                `Via IPO JSS App`;

            // Try native share first
            if (navigator.share) {
                navigator.share({
                    title: ipo.name + ' IPO',
                    text: shareText
                }).catch((err) => {
                    // If share fails, copy to clipboard
                    copyToClipboard(shareText);
                });
            } else {
                // Fallback to clipboard
                copyToClipboard(shareText);
            }
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✓ IPO details copied to clipboard!');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✓ IPO details copied!');
            } catch (err) {
                showToast('❌ Copy failed. Please try again.');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: #1e2530;
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5);
                animation: slideUp 0.3s ease-out;
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideDown 0.3s ease-out';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 2000);
        }

        function setFilter(status) {
            currentFilter = status;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`.tab[data-status="${status}"]`).classList.add('active');
            applyFilter();
        }

        function applyFilter() {
            const mainboardChecked = document.getElementById('mainboard-filter').checked;
            const smeChecked = document.getElementById('sme-filter').checked;

            let filtered = IPO_LIST.filter(ipo => {
                const statusMatch = ipo.status.toLowerCase() === currentFilter;
                const boardMatch = (mainboardChecked && ipo.board.toLowerCase() === 'mainboard') ||
                    (smeChecked && ipo.board.toLowerCase() === 'sme');
                return statusMatch && boardMatch;
            });

            const badge = document.getElementById('filter-badge');
            if (!mainboardChecked || !smeChecked) {
                const activeBoards = [];
                if (mainboardChecked) activeBoards.push('Mainboard');
                if (smeChecked) activeBoards.push('SME');
                badge.textContent = `Filtered by ${activeBoards.join(' & ')}`;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }

            renderIPOs(filtered);
        }

        function openSearch() {
            const modal = document.getElementById('search-modal');
            const input = document.getElementById('search-input');
            modal.classList.add('active');
            input.value = '';
            input.focus();
            renderSearchResults('');

            input.oninput = (e) => renderSearchResults(e.target.value);
        }

        function closeSearch() {
            document.getElementById('search-modal').classList.remove('active');
        }

        function renderSearchResults(query) {
            const results = document.getElementById('search-results');
            const filtered = query.trim() === '' ? IPO_LIST :
                IPO_LIST.filter(ipo => ipo.name.toLowerCase().includes(query.toLowerCase()));

            results.innerHTML = '';
            filtered.forEach((ipo, index) => {
                const card = document.createElement('div');
                card.className = 'ipo-card';
                card.onclick = () => {
                    closeSearch();
                    openModal(ipo);
                };

                card.innerHTML = `
                    <div class="card-header">
                        <div class="company-logo" style="background: ${getLogoColor(index)}">
                            ${getInitials(ipo.name)}
                        </div>
                        <div class="card-title">
                            <div class="company-name">${ipo.name}</div>
                            <div class="company-board">${ipo.status.toUpperCase()} • ${ipo.board}</div>
                        </div>
                    </div>
                `;
                results.appendChild(card);
            });
        }

        // Initialize Firebase Data Fetching
        async function fetchIPOsFromFirebase() {
            try {
                const snap = await get(ref(db, "ipos"));
                const data = snap.val();
                if (data) {
                    // Map Firebase object to array format
                    const firebaseList = Object.entries(data).map(([key, val]) => {
                        return {
                            ...val,
                            id: key,
                            openDate: val.open || "",
                            closeDate: val.close || "",
                            allotment: val.allotment || "",
                            listing: val.listing || "",
                            lotSize: val.lot || "",
                            subscribers: val.subs || ""
                        };
                    });
                    if (firebaseList.length > 0) {
                        IPO_LIST = firebaseList;
                        console.log("Loaded from Firebase:", IPO_LIST.length);
                    }
                }
            } catch (error) {
                console.error("Firebase error:", error);
            } finally {
                applyFilter();
            }
        }

        // Exposet functions to window for onclick handlers
        // Helper functions for global access
        window.openModalById = (id) => {
            const ipo = IPO_LIST.find(i => i.id === id);
            if (ipo) openModal(ipo);
        };

        window.shareByIpoId = (id, event) => {
            const ipo = IPO_LIST.find(i => i.id === id);
            if (ipo) shareIPO(ipo, event);
        };

        window.setFilter = setFilter;
        window.applyFilter = applyFilter;
        window.openSearch = openSearch;
        window.closeSearch = closeSearch;
        window.showNotifications = showNotifications;
        window.closeModal = closeModal;
        window.openModal = openModal;
        window.shareIPO = shareIPO;

        // Start
        fetchIPOsFromFirebase();
    </script>
