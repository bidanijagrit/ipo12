<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPO JSS - Live IPO Updates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f29;
            --bg-card: #1e2530;
            --border-color: #2a3140;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --text-muted: #6c757d;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #0f1419;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.6s ease-in-out 2.5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .splash-logo {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: logoFadeIn 0.8s ease-out;
            padding: 10px;
        }

        @keyframes logoFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .splash-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .splash-text {
            color: white;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
            animation: textFadeIn 0.8s ease-out 0.3s backwards;
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-subtitle {
            display: none;
        }

        .splash-tagline {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: textFadeIn 0.8s ease-out 0.7s backwards;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
        }

        .icon-btn:hover {
            background: var(--border-color);
        }

        .notification-badge {
            position: relative;
        }

        .notification-badge::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
        }

        /* Search Modal */
        .search-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1001;
            padding: 20px;
        }

        .search-modal.active {
            display: flex;
            flex-direction: column;
        }

        .search-header {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 65px;
            z-index: 99;
        }

        .tab {
            flex: 1;
            padding: 14px 16px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: var(--text-secondary);
        }

        .tab.active[data-status="open"] {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        .tab.active[data-status="upcoming"] {
            color: var(--accent-orange);
            border-bottom-color: var(--accent-orange);
        }

        .tab.active[data-status="closed"] {
            color: var(--accent-red);
            border-bottom-color: var(--accent-red);
        }

        /* Filter Section */
        .filter-section {
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 113px;
            z-index: 98;
        }

        .filter-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .board-filters {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .board-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .board-filter input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        .board-filter label {
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Sort button removed as requested */

        .active-filter-badge {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-primary);
        }

        /* Main Content */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 8px;
        }

        /* IPO Cards */
        .ipo-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 40px;
            transition: all 0.2s;
        }

        .ipo-card:hover {
            border-color: var(--border-color);
        }

        .card-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .company-logo {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .card-title {
            flex: 1;
        }

        .company-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .company-board {
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-divider {
            height: 1px;
            background: var(--border-color);
            margin: 12px 0;
        }

        .card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 16px;
            margin-bottom: 16px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .info-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            text-align: right;
        }

        .gmp-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            margin-top: 4px;
            border-top: 1px solid var(--border-color);
        }

        .gmp-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .gmp-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 60px;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-view {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-share {
            background: var(--accent-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .board-badge {
            margin-top: 12px;
            padding: 8px;
            background: var(--accent-orange);
            color: white;
            text-align: center;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            pointer-events: none;
            user-select: none;
        }

        .board-badge.mainboard {
            background: var(--accent-purple);
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 12px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
            border-radius: 12px 12px 0 0;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-close:hover {
            background: var(--bg-card);
        }

        .modal-body {
            padding: 16px 8px;
        }

        .detail-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
        }

        .detail-table th,
        .detail-table td {
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-table th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .detail-table tr:last-child td {
            border-bottom: none;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 13px;
            text-align: right;
        }

        .highlights-list {
            list-style: none;
        }

        .highlights-list li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
            font-size: 13px;
            line-height: 1.5;
        }

        .highlights-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .card-info {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .filter-section {
                top: 65px;
            }

            .tabs {
                top: 65px;
            }
        }
    </style>
</head>

<body>
    <!-- Splash Screen -->
    <div class="splash-screen">
        <div class="splash-logo">
            <img src="https://i.postimg.cc/DSLRTB8m/file-00000000ff4471fd807ff67a7c231bf8-2.png" alt="IPO JSS Logo">
        </div>
        <div class="splash-text">IPO JSS</div>
        <div class="splash-subtitle">Live IPO Updates & Analysis</div>
        <div class="splash-tagline">Trade Smart . Trade GMP</div>
    </div>

    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="header-logo">
                    <img src="https://i.postimg.cc/DSLRTB8m/file-00000000ff4471fd807ff67a7c231bf8-2.png" alt="IPO JSS">
                </div>
                <div class="header-title">
                    <h1>IPO JSS</h1>
                    <div class="header-subtitle">Trade Smart . Trade GMP</div>
                </div>
            </div>
            <div class="header-actions">
                <div class="icon-btn" onclick="openSearch()" title="Search IPOs">
                    🔍
                </div>
                <div class="icon-btn notification-badge" onclick="showNotifications()" title="Notifications">
                    🔔
                </div>
            </div>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" data-status="open" onclick="setFilter('open')">OPEN</button>
        <button class="tab" data-status="upcoming" onclick="setFilter('upcoming')">UPCOMING</button>
        <button class="tab" data-status="closed" onclick="setFilter('closed')">CLOSED</button>
    </div>

    <div class="filter-section">
        <div class="filter-content">
            <div class="board-filters">
                <div class="board-filter">
                    <input type="checkbox" id="mainboard-filter" checked onchange="applyFilter()">
                    <label for="mainboard-filter">MAINBOARD</label>
                </div>
                <div class="board-filter">
                    <input type="checkbox" id="sme-filter" checked onchange="applyFilter()">
                    <label for="sme-filter">SME</label>
                </div>
            </div>
        </div>
    </div>

    <div class="active-filter-badge" id="filter-badge"></div>

    <main id="container"></main>

    <div class="empty" id="empty" hidden>No IPO found. Try changing filters.</div>

    <!-- Search Modal -->
    <div class="search-modal" id="search-modal">
        <div class="search-header">
            <input type="text" class="search-input" id="search-input" placeholder="Search IPO by name..." autofocus>
            <button class="icon-btn" onclick="closeSearch()">✕</button>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-company-name"></div>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        // Static IPO Data
        const DEFAULT_IPO_LIST = [
            {
                name: "Rurih Industries",
                status: "closed",
                board: "Mainboard",
                openDate: "02 Dec 2025",
                closeDate: "05 Dec 2025",
                priceBand: "₹120 - ₹128",
                lotSize: "80 shares",
                issueSize: "₹650 Cr",
                allotment: "09 Dec 2025",
                listing: "12 Dec 2025",
                gmp: "+18%",
                listingGains: "+15.4%",
                subscribers: "3.8x",
                qib: "5.1x",
                nii: "3.0x",
                retail: "2.2x",
                description: "Specialty chemicals manufacturer with export focus.",
                sector: "Chemicals",
                exchange: "NSE | BSE",
                business: "Aromatic intermediates & performance additives",
                registrar: "KFintech",
                leadManagers: "Axis Capital, ICICI Securities",
                website: "#",
                highlights: [
                    "70% capacity utilisation; brownfield expansion underway",
                    "Long-term contracts with EU agrochemical majors",
                    "EBITDA margin 18.5%, ROCE 19% (FY25)"
                ]
            },
            {
                name: "Nova Mobility",
                status: "open",
                board: "Mainboard",
                openDate: "14 Dec 2025",
                closeDate: "18 Dec 2025",
                priceBand: "₹410 - ₹432",
                lotSize: "34 shares",
                issueSize: "₹1,250 Cr",
                allotment: "19 Dec 2025",
                listing: "23 Dec 2025",
                gmp: "+22%",
                listingGains: null,
                subscribers: "—",
                qib: "—",
                nii: "—",
                retail: "—",
                description: "EV drivetrain & battery pack maker with strong OEM tie-ups.",
                sector: "EV / Auto",
                exchange: "NSE | BSE",
                business: "E-axles, battery packs, BMS software for 2W/4W EVs",
                registrar: "Link Intime",
                leadManagers: "Kotak, JM Financial",
                website: "#",
                highlights: [
                    "Order book: ₹3,400 Cr; 60% from repeat OEMs",
                    "Backward integrated for cells & power electronics",
                    "Positive cash flow from operations last 6 quarters"
                ]
            }
        ];

        let IPO_LIST = DEFAULT_IPO_LIST;
        let currentFilter = 'open';

        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
        }

        function getLogoColor(index) {
            const colors = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                'linear-gradient(135deg, #30cfd0 0%, #330867 100%)'
            ];
            return colors[index % colors.length];
        }

        function shareIPO(ipo, event) {
            event.stopPropagation();

            const shareText = `📊 ${ipo.name} IPO Details\n\n` +
                `💰 Price Band: ${ipo.priceBand}\n` +
                `📅 Dates: ${ipo.openDate} - ${ipo.closeDate}\n` +
                `📈 GMP: ${ipo.gmp}\n` +
                `💵 Issue Size: ${ipo.issueSize}\n` +
                `📦 Lot Size: ${ipo.lotSize}\n\n` +
                `Via IPO JSS App`;

            // Try native share first
            if (navigator.share) {
                navigator.share({
                    title: ipo.name + ' IPO',
                    text: shareText
                }).catch((err) => {
                    // If share fails, copy to clipboard
                    copyToClipboard(shareText);
                });
            } else {
                // Fallback to clipboard
                copyToClipboard(shareText);
            }
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✓ IPO details copied to clipboard!');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✓ IPO details copied!');
            } catch (err) {
                showToast('❌ Copy failed. Please try again.');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: #1e2530;
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5);
                animation: slideUp 0.3s ease-out;
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideDown 0.3s ease-out';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 2000);
        }

        function renderIPOs(list) {
            const container = document.getElementById('container');
            const empty = document.getElementById('empty');

            container.innerHTML = '';

            if (list.length === 0) {
                empty.hidden = false;
                return;
            }

            empty.hidden = true;

            list.forEach((ipo, index) => {
                const card = document.createElement('div');
                card.className = 'ipo-card';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="company-logo" style="background: ${getLogoColor(index)}">
                            ${getInitials(ipo.name)}
                        </div>
                        <div class="card-title">
                            <div class="company-name">${ipo.name}</div>
                            <div class="company-board">(${ipo.board.toUpperCase()})</div>
                        </div>
                    </div>
                    
                    <div class="card-divider"></div>
                    
                    <div class="card-info">
                        <div class="info-item">
                            <span class="info-label">Date:</span>
                            <span class="info-value">${ipo.openDate} - ${ipo.closeDate}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Price:</span>
                            <span class="info-value">${ipo.priceBand}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Lot Size:</span>
                            <span class="info-value">${ipo.lotSize}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Issue Size:</span>
                            <span class="info-value">${ipo.issueSize}</span>
                        </div>
                    </div>
                    
                    <div class="gmp-section">
                        <span class="gmp-label">GMP Rumors*:</span>
                        <span class="gmp-value">${ipo.gmp}</span>
                    </div>
                    
                    ${ipo.status !== 'upcoming' ? `
                    <div style="padding-top:12px; border-top:1px solid var(--border-color); margin-top:12px;">
                        <div class="info-item" style="margin-bottom:10px;">
                            <span class="info-label">Allotment Date</span>
                            <span class="info-value">${ipo.allotment}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Listing Date</span>
                            <span class="info-value">${ipo.listing}</span>
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="card-actions">
                        <button class="btn btn-view" data-ipo-index="${index}">VIEW</button>
                        <button class="btn btn-share" data-ipo-index="${index}">📤</button>
                    </div>
                    
                    <div class="board-badge ${ipo.board.toLowerCase()}">${ipo.board.toUpperCase()}</div>
                `;

                // Add event listeners to buttons only
                const viewBtn = card.querySelector('.btn-view');
                const shareBtn = card.querySelector('.btn-share');

                viewBtn.onclick = () => openModal(ipo);
                shareBtn.onclick = (e) => shareIPO(ipo, e);

                container.appendChild(card);
            });
        }

        function setFilter(status) {
            currentFilter = status;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`.tab[data-status="${status}"]`).classList.add('active');
            applyFilter();
        }

        function applyFilter() {
            const mainboardChecked = document.getElementById('mainboard-filter').checked;
            const smeChecked = document.getElementById('sme-filter').checked;

            let filtered = IPO_LIST.filter(ipo => {
                const statusMatch = ipo.status.toLowerCase() === currentFilter;
                const boardMatch = (mainboardChecked && ipo.board.toLowerCase() === 'mainboard') ||
                    (smeChecked && ipo.board.toLowerCase() === 'sme');
                return statusMatch && boardMatch;
            });

            const badge = document.getElementById('filter-badge');
            if (!mainboardChecked || !smeChecked) {
                const activeBoards = [];
                if (mainboardChecked) activeBoards.push('Mainboard');
                if (smeChecked) activeBoards.push('SME');
                badge.textContent = `Filtered by ${activeBoards.join(' & ')}`;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }

            renderIPOs(filtered);
        }

        function openSearch() {
            const modal = document.getElementById('search-modal');
            const input = document.getElementById('search-input');
            modal.classList.add('active');
            input.value = '';
            input.focus();
            renderSearchResults('');

            input.oninput = (e) => renderSearchResults(e.target.value);
        }

        function closeSearch() {
            document.getElementById('search-modal').classList.remove('active');
        }

        function renderSearchResults(query) {
            const results = document.getElementById('search-results');
            const filtered = query.trim() === '' ? IPO_LIST :
                IPO_LIST.filter(ipo => ipo.name.toLowerCase().includes(query.toLowerCase()));

            results.innerHTML = '';
            filtered.forEach((ipo, index) => {
                const card = document.createElement('div');
                card.className = 'ipo-card';
                card.onclick = () => {
                    closeSearch();
                    openModal(ipo);
                };

                card.innerHTML = `
                    <div class="card-header">
                        <div class="company-logo" style="background: ${getLogoColor(index)}">
                            ${getInitials(ipo.name)}
                        </div>
                        <div class="card-title">
                            <div class="company-name">${ipo.name}</div>
                            <div class="company-board">${ipo.status.toUpperCase()} • ${ipo.board}</div>
                        </div>
                    </div>
                `;
                results.appendChild(card);
            });
        }

        function showNotifications() {
            alert('Notifications:\n\n• GMP updates will appear here\n• New IPO announcements\n• Allotment results\n\n(Feature coming soon!)');
        }

        function openModal(ipo) {
            const modal = document.getElementById('detail-modal');
            const modalBody = document.getElementById('modal-body');
            document.getElementById('modal-company-name').textContent = ipo.name;

            modalBody.innerHTML = `
                <div class="detail-section">
                    <div class="section-title">IPO Details</div>
                    <div class="detail-row">
                        <span class="detail-label">Total Issue Size</span>
                        <span class="detail-value">${ipo.issueSize}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Price Band</span>
                        <span class="detail-value">${ipo.priceBand}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Lot Size</span>
                        <span class="detail-value">${ipo.lotSize}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Listing At</span>
                        <span class="detail-value">${ipo.exchange}</span>
                    </div>
                </div>
                
                ${ipo.status !== 'upcoming' ? `
                <div class="detail-section">
                    <div class="section-title">Subscription Details</div>
                    <table class="detail-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Times</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>QIB</td>
                                <td>${ipo.qib}</td>
                            </tr>
                            <tr>
                                <td>NII</td>
                                <td>${ipo.nii}</td>
                            </tr>
                            <tr>
                                <td>Retail</td>
                                <td>${ipo.retail}</td>
                            </tr>
                            <tr>
                                <td><strong>Total</strong></td>
                                <td><strong>${ipo.subscribers}</strong></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                ` : ''}
                
                <div class="detail-section">
                    <div class="section-title">Lot(s) Distribution</div>
                    <table class="detail-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Individual</th>
                                <th>HNI</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Min Share</td>
                                <td>2400</td>
                                <td>3600</td>
                            </tr>
                            <tr>
                                <td>Min Amount</td>
                                <td>235200</td>
                                <td>352800</td>
                            </tr>
                            <tr>
                                <td>Total Lots</td>
                                <td>772</td>
                                <td>514</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="detail-section">
                    <div class="section-title">IPO Reservation</div>
                    <table class="detail-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Shares Offered</th>
                                <th>%</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>HNI</td>
                                <td>18,51,600</td>
                                <td>47.48%</td>
                            </tr>
                            <tr>
                                <td>INDIVIDUAL</td>
                                <td>18,51,600</td>
                                <td>47.48%</td>
                            </tr>
                            <tr>
                                <td>Market Maker</td>
                                <td>1,96,800</td>
                                <td>5.05%</td>
                            </tr>
                            <tr>
                                <td><strong>Total</strong></td>
                                <td><strong>39,00,000</strong></td>
                                <td><strong>100.00%</strong></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                ${ipo.highlights && ipo.highlights.length > 0 ? `
                <div class="detail-section">
                    <div class="section-title">Key Highlights</div>
                    <ul class="highlights-list">
                        ${ipo.highlights.map(h => `<li>${h}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}
                
                <div class="detail-section">
                    <div class="section-title">Registrar</div>
                    <div class="detail-row">
                        <span class="detail-label">Name</span>
                        <span class="detail-value">${ipo.registrar}</span>
                    </div>
                </div>
                
                ${ipo.leadManagers ? `
                <div class="detail-section">
                    <div class="section-title">Lead Manager(s)</div>
                    <div class="detail-value">${ipo.leadManagers}</div>
                </div>
                ` : ''}
                
                <div class="detail-section">
                    <div class="section-title">About</div>
                    <p style="font-size:13px; line-height:1.6; color:var(--text-secondary);">
                        ${ipo.business || ipo.description}
                    </p>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Initialize
        applyFilter();
    </script>
</body>

</html>
