<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPO JSS | Trade GMP. Trade Smart.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(124, 58, 237, 0.4), 0 0 40px rgba(16, 185, 129, 0.3); }
      50% { box-shadow: 0 0 40px rgba(124, 58, 237, 0.6), 0 0 80px rgba(16, 185, 129, 0.5); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes particleFloat {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(50px) rotate(360deg); opacity: 0; }
    }
    @keyframes progressBar {
      from { width: 0%; }
      to { width: 100%; }
    }
    :root {
      --bg: #0a0e1a;
      --card: rgba(15, 23, 42, 0.85);
      --muted: #94a3b8;
      --accent: #7c3aed;
      --accent-2: #10b981;
      --accent-3: #3b82f6;
      --border: rgba(255, 255, 255, 0.08);
      --chip: rgba(30, 41, 59, 0.6);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.6);
    }
    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: 
        radial-gradient(circle at 5% 10%, rgba(124, 58, 237, 0.2), transparent 30%),
        radial-gradient(circle at 95% 5%, rgba(16, 185, 129, 0.18), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(59, 130, 246, 0.15), transparent 35%),
        linear-gradient(180deg, #0a0e1a 0%, #0f172a 50%, #0a0e1a 100%);
      background-attachment: fixed;
      color: white;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .splash {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.3), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.25), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.2), transparent 40%),
        linear-gradient(135deg, #0a0e1a 0%, #0f172a 50%, #0a0e1a 100%);
      display: grid;
      place-items: center;
      z-index: 9999;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
      overflow: hidden;
    }
    .splash.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .splash-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .splash-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: linear-gradient(135deg, #7c3aed, #10b981);
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat 8s ease-in-out infinite;
    }
    .splash-particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 10s; }
    .splash-particle:nth-child(2) { left: 20%; animation-delay: 1s; animation-duration: 12s; }
    .splash-particle:nth-child(3) { left: 30%; animation-delay: 2s; animation-duration: 9s; }
    .splash-particle:nth-child(4) { left: 40%; animation-delay: 0.5s; animation-duration: 11s; }
    .splash-particle:nth-child(5) { left: 50%; animation-delay: 1.5s; animation-duration: 13s; }
    .splash-particle:nth-child(6) { left: 60%; animation-delay: 2.5s; animation-duration: 10s; }
    .splash-particle:nth-child(7) { left: 70%; animation-delay: 0.8s; animation-duration: 12s; }
    .splash-particle:nth-child(8) { left: 80%; animation-delay: 1.8s; animation-duration: 11s; }
    .splash-particle:nth-child(9) { left: 90%; animation-delay: 3s; animation-duration: 9s; }
    .splash-content {
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 40px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(30px) saturate(180%);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: fadeInScale 1s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 320px;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 32px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(16, 185, 129, 0.3));
      padding: 16px;
      box-shadow: 
        0 30px 80px rgba(124, 58, 237, 0.5),
        0 0 0 2px rgba(255, 255, 255, 0.1),
        inset 0 2px 10px rgba(255, 255, 255, 0.1);
      animation: fadeInScale 1s ease-out 0.2s both, float 3s ease-in-out infinite 1.5s, glow 2s ease-in-out infinite 2s;
      position: relative;
    }
    .splash-logo::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 32px;
      background: linear-gradient(135deg, #7c3aed, #10b981, #3b82f6);
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
      opacity: 0.3;
      z-index: -1;
      filter: blur(20px);
    }
    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    }
    .splash-title {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, #7c3aed, #10b981, #3b82f6, #7c3aed);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      letter-spacing: -1px;
      animation: fadeInUp 1s ease-out 0.4s both, gradientShift 3s ease infinite 1.5s;
      text-shadow: 0 0 40px rgba(124, 58, 237, 0.3);
    }
    .splash-tagline {
      color: #cbd5e1;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
      animation: fadeInUp 1s ease-out 0.6s both;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    .splash-loader-container {
      margin-bottom: 24px;
    }
    .splash-loader {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #7c3aed;
      border-right-color: #10b981;
      border-bottom-color: #3b82f6;
      animation: spin 1s linear infinite;
      position: relative;
    }
    .splash-loader::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 5px solid transparent;
      border-top-color: rgba(124, 58, 237, 0.3);
      border-right-color: rgba(16, 185, 129, 0.3);
      animation: spin 1.5s linear infinite reverse;
    }
    .splash-progress {
      width: 200px;
      height: 4px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .splash-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #10b981, #3b82f6);
      background-size: 200% 100%;
      border-radius: 10px;
      animation: progressBar 1.2s ease-out forwards, gradientShift 2s ease infinite;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
    }
    .splash-status {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      animation: fadeInUp 0.8s ease-out 0.8s both;
      letter-spacing: 0.3px;
      transition: opacity 0.3s ease;
    }
    header {
      padding: 20px clamp(20px, 5vw, 48px);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px) saturate(180%);
      background: rgba(10, 14, 26, 0.75);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #10b981);
      padding: 8px;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    }
    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-tagline {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .search {
      position: relative;
      flex: 1 1 280px;
      max-width: 480px;
    }
    .search input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      color: white;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .search input:focus {
      border-color: rgba(124, 58, 237, 0.6);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .search input::placeholder {
      color: var(--muted);
    }
    .search svg {
      position: absolute;
      top: 14px;
      left: 18px;
      width: 20px;
      height: 20px;
      opacity: 0.6;
      pointer-events: none;
    }
    .filters {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip {
      background: var(--chip);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }
    .chip:hover {
      border-color: rgba(124, 58, 237, 0.4);
      color: white;
      transform: translateY(-2px);
    }
    .chip.active {
      border-color: rgba(124, 58, 237, 0.8);
      color: white;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(16, 185, 129, 0.2));
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3), 0 0 0 1px rgba(124, 58, 237, 0.2);
      transform: translateY(-2px);
    }
    main {
      padding: 32px clamp(20px, 5vw, 48px) 48px;
      position: relative;
      z-index: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px) saturate(180%);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out both;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1.5px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.5), rgba(16, 185, 129, 0.4), rgba(59, 130, 246, 0.3));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(124, 58, 237, 0.5);
      box-shadow: var(--shadow-lg), 0 0 40px rgba(124, 58, 237, 0.2);
    }
    .card:hover::before {
      opacity: 1;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .card h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      color: white;
      flex: 1;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .badge.open { 
      background: rgba(16, 185, 129, 0.2); 
      color: #34d399; 
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge.upcoming { 
      background: rgba(124, 58, 237, 0.2); 
      color: #c084fc; 
      border: 1px solid rgba(124, 58, 237, 0.3);
    }
    .badge.closed { 
      background: rgba(248, 113, 113, 0.2); 
      color: #fca5a5; 
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
    .tag-row { 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
    }
    .tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(16, 185, 129, 0.15));
      border: 1px solid rgba(124, 58, 237, 0.2);
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .pill-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .meta strong { 
      display: block; 
      color: white; 
      margin-bottom: 4px; 
      font-size: 14px; 
      font-weight: 700;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 4px;
    }
    .metric {
      padding: 12px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      text-align: center;
      transition: all 0.3s ease;
    }
    .metric:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }
    .metric .label {
      font-size: 10px;
      letter-spacing: 0.5px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .metric .value {
      font-size: 15px;
      font-weight: 800;
      color: #e5e7eb;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.3s ease;
    }
    details[open] {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(124, 58, 237, 0.3);
    }
    summary {
      cursor: pointer;
      font-weight: 700;
      color: white;
      list-style: none;
      font-size: 14px;
      padding: 4px 0;
      transition: color 0.2s ease;
    }
    summary:hover {
      color: #c084fc;
    }
    summary::marker { display: none; }
    summary::-webkit-details-marker { display: none; }
    .note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.6;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px;
    }
    .detail-grid strong { 
      display: block; 
      color: white; 
      margin-bottom: 4px; 
      font-weight: 700;
    }
    .list {
      margin: 12px 0 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .list li {
      margin-bottom: 6px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    a.button, button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      min-width: 140px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #10b981);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.5);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transform: translateY(-2px);
    }
    .btn-disabled {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-link {
      padding: 0;
      border: none;
      background: none;
      color: #a5b4fc;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .btn-link:hover {
      color: #818cf8;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      border: 2px dashed var(--border);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 16px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .search {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-particles">
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
    </div>
    <div class="splash-content">
      <div class="splash-logo">
        <img src="https://i.postimg.cc/DSLRTB8m/file-00000000ff4471fd807ff67a7c231bf8-2.png" alt="IPO JSS Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'width:100%;height:100%;background:linear-gradient(135deg,#7c3aed,#10b981);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:white;text-shadow:0 4px 20px rgba(0,0,0,0.3);\'>IPO JSS</div>'">

      open: { text: "Open", cls: "open" },
      upcoming: { text: "Upcoming", cls: "upcoming" },
      closed: { text: "Closed", cls: "closed" },

      grid.innerHTML = "";
      if (!list.length) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      list.forEach((ipo, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.style.animationDelay = `${index * 0.05}s`;
        card.innerHTML = `
          <div class="card-header">
            <h3>${ipo.name}</h3>
            <span class="badge ${statusLabel[ipo.status].cls}">${statusLabel[ipo.status].text}</span>

            <summary>Details & Allotment</summary>

            <div class="detail-grid">
              <div><strong>Business</strong>${ipo.business}</div>

              ${

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = IPO_LIST.filter((ipo) => {
        const byStatus = activeFilter === "all" || ipo.status === activeFilter;
        const byText = !q || ipo.name.toLowerCase().includes(q) || ipo.sector.toLowerCase().includes(q);
        return byStatus && byText;
      });
      render(filtered);
    }

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        chips.forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        activeFilter = chip.dataset.filter;
        applyFilter();
      });
    });

    searchInput.addEventListener("input", applyFilter);

    // Splash screen status updates
    const splashStatus = document.getElementById("splashStatus");
    const statusMessages = [
      "Initializing premium IPO tracker...",
      "Loading market data...",
      "Preparing dashboard...",
      "Almost ready..."
    ];
    
    function updateSplashStatus(index) {
      if (splashStatus && index < statusMessages.length) {
        splashStatus.textContent = statusMessages[index];
        splashStatus.style.opacity = "0";
        setTimeout(() => {
          splashStatus.textContent = statusMessages[index];
          splashStatus.style.opacity = "1";
        }, 200);
      }
    }

    // Initialize app with enhanced splash screen
    window.addEventListener("load", () => {
      let statusIndex = 0;
      const statusInterval = setInterval(() => {
        updateSplashStatus(statusIndex);
        statusIndex++;
        if (statusIndex >= statusMessages.length) {
          clearInterval(statusInterval);
        }
      }, 400);

      // Initialize IPOs
      setTimeout(() => {
        initializeIpos();
      }, 800);

          setTimeout(() => {
            splash.style.display = "none";
          }, 1000);
        }
      }, 2000);
    });
  </script>
